<app-navbar></app-navbar>
<div class="container mt-4">

    <div class="mb-4">

        <h2>
            Available Jobs
        </h2>

    </div>

    <div class="row g-4">

        @for(job of jobs; track job.id) {

        <div class="col-md-6">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h4>{{ job.title }}</h4>

                    <h6 class="text-muted">
                        {{ job.companyName }}
                    </h6>

                    <p>
                        <strong>Location:</strong>
                        {{ job.location }}
                    </p>

                    <p>
                        {{ job.description }}
                    </p>

                    <div class="mt-3 d-flex gap-2">

                        @if(
                            role === 'Admin'
                            ||
                            (role === 'Recruiter' && job.recruiterId === currentUserId)
                        ) {

                        <a
                            class="btn btn-warning"
                            [routerLink]="['/edit-job', job.id]">

                            Edit

                        </a>

                        <button
                            class="btn btn-danger"
                            (click)="deleteJob(job.id)">

                            Delete

                        </button>

                        }

                        @if(role === 'Student') {

                        <button
                            class="btn btn-success"
                            (click)="apply(job.id)">

                            Apply

                        </button>

                        }

                    </div>

                </div>

            </div>

        </div>

        }

    </div>

</div>
