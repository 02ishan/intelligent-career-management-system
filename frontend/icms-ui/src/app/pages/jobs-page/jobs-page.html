<div class="container mt-4">

    <h2 class="mb-4">
        Available Jobs
    </h2>

    <div class="row g-4">

        @for(job of jobs; track job.id) {

        <div class="col-md-6">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h4>{{ job.title }}</h4>

                    <h6 class="text-muted">
                        {{ job.companyName }}
                    </h6>

                    <p>
                        <strong>Location:</strong>
                        {{ job.location }}
                    </p>

                    <p>
                        {{ job.description }}
                    </p>

                </div>

            </div>

        </div>

        }

    </div>

</div>
