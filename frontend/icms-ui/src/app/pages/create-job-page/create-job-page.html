<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-body">

            <h2 class="mb-4">
                Create Job
            </h2>

            <form (ngSubmit)="createJob()">

                <div class="mb-3">
                    <label class="form-label">
                        Job Title
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="title"
                        name="title">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Company Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="companyName"
                        name="companyName">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Location
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="location"
                        name="location">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        class="form-control"
                        rows="4"
                        [(ngModel)]="description"
                        name="description">
                    </textarea>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary">
                    Create Job
                </button>

            </form>

        </div>

    </div>

</div>
